[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://eventora-server.onrender.com/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://eventora-server.onrender.com/api"

[context.branch-deploy.environment]
  VITE_API_URL = "https://eventora-server.onrender.com/api"
